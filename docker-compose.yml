version: "3.9"

services:
  # DWH
  postgres_dwh:
    image: postgres:15
    container_name: postgres_dwh
    environment:
      POSTGRES_USER: postgres_dwh
      POSTGRES_PASSWORD: postgres_dwh
      POSTGRES_DB: postgres
    volumes:
      - postgres_dwh_data:/var/lib/postgresql/data
      - ./data/db_init:/docker-entrypoint-initdb.d
    ports:
      - 5433:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres_dwh && psql -U postgres_dwh -d postgres -c 'SELECT 1'" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  default:

volumes:
  postgres_dwh_data: